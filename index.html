<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PT Trainer — European Portuguese</title>
<style>
  :root {
    --bg:       #f0fdf4;
    --surface:  #ffffff;
    --surface2: #f7fef9;
    --border:   #d1fae5;
    --accent:   #16a34a;
    --accent2:  #059669;
    --text:     #1e293b;
    --muted:    #64748b;
    --red:      #ef4444;
    --yellow:   #f59e0b;
    --shadow:   0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.05);
    --shadow-lg:0 4px 16px rgba(22,163,74,.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 32px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: var(--shadow);
  }

  header h1 {
    font-size: 1.2rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--accent);
  }

  header .badge {
    font-size: 0.75rem;
    color: var(--muted);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2px 10px;
  }

  nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    display: flex;
    gap: 2px;
  }

  nav button {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.875rem;
    font-weight: 500;
    padding: 13px 18px;
    transition: color 0.15s, border-color 0.15s;
  }
  nav button:hover { color: var(--text); }
  nav button.active { color: var(--accent); border-bottom-color: var(--accent); }

  main {
    flex: 1;
    padding: 36px 32px;
    max-width: 900px;
    margin: 0 auto;
    width: 100%;
  }

  .section { display: none; }
  .section.active { display: block; }

  /* ── FLASHCARDS ── */
  .card-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }

  .mode-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    cursor: pointer;
    font-size: 0.78rem;
    font-weight: 500;
    padding: 7px 14px;
    transition: all 0.15s;
    box-shadow: var(--shadow);
  }
  .mode-btn:hover { border-color: var(--accent); color: var(--accent); }
  .mode-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .audio-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.78rem;
    font-weight: 500;
    padding: 7px 14px;
    transition: all 0.15s;
    box-shadow: var(--shadow);
    margin-left: 6px;
  }
  .audio-btn:hover { border-color: var(--accent); color: var(--accent); }
  .audio-btn.on { background: #ecfdf5; border-color: var(--accent); color: var(--accent); }

  .audio-speaking {
    position: absolute;
    bottom: 14px;
    left: 16px;
    display: flex;
    gap: 3px;
    align-items: flex-end;
    height: 16px;
  }
  .audio-speaking span {
    display: block;
    width: 3px;
    border-radius: 2px;
    background: var(--accent);
    animation: audioBar 0.8s ease-in-out infinite;
  }
  .audio-speaking span:nth-child(1) { height: 6px;  animation-delay: 0s; }
  .audio-speaking span:nth-child(2) { height: 12px; animation-delay: 0.15s; }
  .audio-speaking span:nth-child(3) { height: 8px;  animation-delay: 0.3s; }
  .audio-speaking span:nth-child(4) { height: 14px; animation-delay: 0.1s; }
  .audio-speaking span:nth-child(5) { height: 5px;  animation-delay: 0.25s; }
  .audio-speaking.hidden { display: none; }

  @keyframes audioBar {
    0%, 100% { transform: scaleY(0.4); opacity: 0.6; }
    50%       { transform: scaleY(1);   opacity: 1; }
  }

  .card-counter { margin-left: auto; font-size: 0.78rem; color: var(--muted); }

  .card-scene {
    perspective: 1200px;
    width: 100%;
    height: 280px;
    cursor: pointer;
    margin-bottom: 24px;
  }

  .card-inner {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4,0,0.2,1);
  }
  .card-inner.flipped { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 32px;
    border: 1.5px solid var(--border);
    box-shadow: var(--shadow-lg);
  }

  .card-front { background: var(--surface); }

  .card-back {
    background: linear-gradient(145deg, #f0fdf4 0%, #dcfce7 100%);
    transform: rotateY(180deg);
    border-color: var(--accent2);
  }

  .card-label {
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
  }

  /* register badge */
  .register-badge {
    font-size: 0.68rem;
    font-weight: 600;
    padding: 2px 10px;
    border-radius: 20px;
    letter-spacing: 0.02em;
    display: none;
  }
  .register-badge.show { display: inline-block; }
  .register-badge.informal {
    background: rgba(245,158,11,.1);
    color: #d97706;
    border: 1px solid rgba(245,158,11,.3);
  }
  .register-badge.formal {
    background: rgba(79,70,229,.08);
    color: #4f46e5;
    border: 1px solid rgba(79,70,229,.25);
  }

  .card-word {
    font-size: 1.85rem;
    font-weight: 700;
    text-align: center;
    letter-spacing: -0.02em;
    line-height: 1.2;
    color: var(--text);
  }
  .card-back .card-word { color: var(--accent); }

  .card-hint { font-size: 0.78rem; color: var(--muted); }

  .card-note {
    font-size: 0.7rem;
    color: var(--muted);
    text-align: center;
    max-width: 90%;
    line-height: 1.55;
    border-top: 1px solid rgba(22,163,74,.15);
    padding-top: 8px;
    font-style: italic;
    display: none;
  }
  .card-note.show { display: block; }
  .card-note b { color: #374151; font-style: normal; }

  .card-category {
    font-size: 0.68rem;
    padding: 3px 10px;
    border-radius: 20px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--muted);
    position: absolute;
    top: 14px;
    right: 14px;
    font-weight: 500;
  }

  .difficulty-dot {
    position: absolute;
    top: 18px;
    left: 16px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  .save-btn {
    position: absolute;
    bottom: 12px;
    right: 14px;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1.15rem;
    color: var(--muted);
    transition: color 0.15s, transform 0.15s;
    padding: 4px;
    z-index: 10;
  }
  .save-btn:hover { color: var(--yellow); transform: scale(1.2); }
  .save-btn.saved { color: var(--yellow); }

  .card-nav {
    display: flex;
    gap: 10px;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
  }

  .btn {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    cursor: pointer;
    font-size: 0.875rem;
    font-weight: 500;
    padding: 10px 22px;
    transition: all 0.15s;
    box-shadow: var(--shadow);
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }

  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .btn-primary:hover { filter: brightness(1.08); border-color: var(--accent); color: #fff; }

  .btn-icon { padding: 10px 15px; font-size: 1rem; }

  .btn-saved { border-color: #fde68a; color: #d97706; background: #fffbeb; }
  .btn-saved.active-filter { background: var(--yellow); border-color: var(--yellow); color: #fff; }

  /* saved panel */
  .saved-panel {
    margin-top: 24px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    display: none;
    box-shadow: var(--shadow);
  }
  .saved-panel.open { display: block; }

  .saved-panel-header {
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 11px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--text);
  }
  .saved-panel-header button {
    background: none;
    border: none;
    color: var(--red);
    cursor: pointer;
    font-size: 0.75rem;
  }

  .saved-list { list-style: none; max-height: 260px; overflow-y: auto; }

  .saved-list li {
    display: flex;
    align-items: center;
    padding: 9px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 0.83rem;
    gap: 10px;
    cursor: pointer;
    transition: background 0.1s;
  }
  .saved-list li:hover { background: var(--bg); }
  .saved-list li:last-child { border-bottom: none; }

  .saved-en { color: var(--muted); flex: 1; }
  .saved-pt { color: var(--accent); flex: 1; font-weight: 500; }

  .saved-reg {
    font-size: 0.63rem;
    font-weight: 600;
    padding: 1px 6px;
    border-radius: 10px;
    flex-shrink: 0;
  }
  .saved-reg.informal { color: #d97706; border: 1px solid rgba(245,158,11,.3); }
  .saved-reg.formal   { color: #4f46e5; border: 1px solid rgba(79,70,229,.25); }

  .remove-saved {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 1rem;
    flex-shrink: 0;
    transition: color 0.15s;
    line-height: 1;
  }
  .remove-saved:hover { color: var(--red); }

  .saved-empty { padding: 22px; text-align: center; color: var(--muted); font-size: 0.83rem; }

  /* ── VERB TENSES ── */
  .tense-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: 18px;
  }

  .tense-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }

  .tense-card h3 {
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    font-size: 0.85rem;
    font-weight: 600;
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--text);
  }
  .tense-card h3 em {
    font-style: normal;
    font-size: 0.7rem;
    color: var(--muted);
    font-weight: 400;
  }

  .tense-body { padding: 14px 16px; }

  .conj-table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
  .conj-table td { padding: 4px 8px; }
  .conj-table td:first-child { color: var(--muted); font-size: 0.76rem; white-space: nowrap; }
  .conj-table td:last-child { color: var(--accent); font-weight: 600; }

  .tense-example {
    margin-top: 10px;
    font-size: 0.76rem;
    color: var(--muted);
    border-top: 1px solid var(--border);
    padding-top: 9px;
    font-style: italic;
    line-height: 1.5;
  }
  .tense-example strong { color: var(--text); font-style: normal; font-weight: 500; }

  .verb-type-tabs {
    display: flex;
    gap: 6px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
  }

  .verb-type-tab {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.72rem;
    font-weight: 600;
    padding: 4px 11px;
    transition: all 0.15s;
    letter-spacing: 0.01em;
  }
  .verb-type-tab:hover:not(.active) { border-color: var(--accent); color: var(--accent); }
  .verb-type-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* ── IRREGULAR VERBS ── */
  .irr-search { margin-bottom: 20px; }

  .irr-search input {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 0.9rem;
    padding: 10px 16px;
    width: 100%;
    outline: none;
    transition: border-color 0.15s;
    box-shadow: var(--shadow);
  }
  .irr-search input:focus { border-color: var(--accent); }
  .irr-search input::placeholder { color: var(--muted); }

  .verb-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }

  .verb-tab {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 500;
    padding: 6px 14px;
    transition: all 0.15s;
    box-shadow: var(--shadow);
  }
  .verb-tab:hover { border-color: var(--accent); color: var(--accent); }
  .verb-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .verb-block {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    display: none;
    box-shadow: var(--shadow);
  }
  .verb-block.visible { display: block; }

  .verb-header {
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  .verb-header h2 { font-size: 1.3rem; color: var(--accent); font-weight: 700; }
  .verb-header span { color: var(--muted); font-size: 0.85rem; }

  .verb-tenses-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  }

  .verb-tense-col {
    padding: 14px 18px;
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }
  .verb-tense-col h4 {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--muted);
    margin-bottom: 10px;
    font-weight: 600;
  }
  .verb-tense-col .forms { display: flex; flex-direction: column; gap: 4px; font-size: 0.83rem; }
  .verb-tense-col .forms span { color: var(--accent); font-weight: 600; }
  .verb-tense-col .forms em { font-style: normal; color: var(--muted); font-size: 0.73rem; margin-right: 6px; }

  @media (max-width: 600px) {
    main { padding: 20px 14px; }
    nav { padding: 0 14px; }
    header { padding: 12px 16px; }
    .card-word { font-size: 1.4rem; }
    .tense-grid { grid-template-columns: 1fr; }
    .card-scene { height: 250px; }
  }
</style>
</head>
<body>

<header>
  <h1>PT Trainer</h1>
  <span class="badge">European Portuguese</span>
</header>

<nav>
  <button class="active" onclick="showSection('flashcards', this)">Flashcards</button>
  <button onclick="showSection('tenses', this)">Verb Tenses</button>
  <button onclick="showSection('irregular', this)">Irregular Verbs</button>
</nav>

<main>

  <!-- FLASHCARDS -->
  <section id="flashcards" class="section active">
    <div class="card-controls">
      <span style="font-size:.78rem;color:var(--muted);font-weight:500">Direction:</span>
      <button class="mode-btn active" id="modeRandom" onclick="setMode('random',this)">Random</button>
      <button class="mode-btn" id="modeEN"     onclick="setMode('en',this)">EN &#8594; PT</button>
      <button class="mode-btn" id="modePT"     onclick="setMode('pt',this)">PT &#8594; EN</button>
      <button class="audio-btn" id="audioBtn"  onclick="toggleAudio()">&#128263; Audio</button>
      <span class="card-counter" id="cardCounter">Card 1</span>
    </div>

    <div class="card-scene" onclick="flipCard()">
      <div class="card-inner" id="cardInner">
        <div class="card-face card-front">
          <div class="difficulty-dot" id="diffDot"></div>
          <div class="card-label" id="frontLabel">English</div>
          <div class="register-badge" id="registerBadge"></div>
          <div class="card-word" id="frontWord"></div>
          <div class="card-hint">Click to reveal</div>
          <div class="card-category" id="frontCat"></div>
          <button class="save-btn" id="saveBtn" onclick="toggleSave(event)" title="Save card">&#9734;</button>
          <div class="audio-speaking hidden" id="audioIndicator">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
        </div>
        <div class="card-face card-back">
          <div class="card-label" id="backLabel">Portuguese</div>
          <div class="card-word" id="backWord"></div>
          <div class="card-hint" id="backHint"></div>
          <div class="card-note" id="cardNote"></div>
        </div>
      </div>
    </div>

    <div class="card-nav">
      <button class="btn btn-icon" onclick="prevCard()">&#8592;</button>
      <button class="btn btn-primary" onclick="nextCard()">Next card</button>
      <button class="btn btn-icon" onclick="shuffleCards()" title="Reshuffle">&#8652;</button>
      <button class="btn btn-saved" id="savedToggleBtn" onclick="toggleSavedPanel()">&#9733; Saved (<span id="savedCount">0</span>)</button>
    </div>

    <div class="saved-panel" id="savedPanel">
      <div class="saved-panel-header">
        <span>Saved cards</span>
        <button onclick="clearAllSaved()">Clear all</button>
      </div>
      <ul class="saved-list" id="savedList"></ul>
    </div>
  </section>

  <!-- VERB TENSES -->
  <section id="tenses" class="section">
    <div class="tense-grid" id="tenseGrid"></div>
  </section>

  <!-- IRREGULAR VERBS -->
  <section id="irregular" class="section">
    <div class="irr-search">
      <input type="text" placeholder="Search verb&#8230;" oninput="filterVerbs(this.value)">
    </div>
    <div class="verb-tabs" id="verbTabs"></div>
    <div id="verbBlocks"></div>
  </section>

</main>

<script>
// ── CARD DATA ──
// register: 'informal'=tu, 'formal'=você, omitted=neutral
const cards = [
  // Greetings & Essentials
  { en:"Hello",                      pt:"Olá",                             cat:"Greetings",    diff:1 },
  { en:"Good morning",               pt:"Bom dia",                         cat:"Greetings",    diff:1 },
  { en:"Good afternoon",             pt:"Boa tarde",                       cat:"Greetings",    diff:1 },
  { en:"Good evening / Good night",  pt:"Boa noite",                       cat:"Greetings",    diff:1 },
  { en:"Please",                     pt:"Por favor / Se faz favor",        cat:"Essentials",   diff:1 },
  { en:"Thank you",                  pt:"Obrigado (m) / Obrigada (f)",     cat:"Essentials",   diff:1 },
  { en:"You're welcome",             pt:"De nada",                         cat:"Essentials",   diff:1 },
  { en:"Excuse me",                  pt:"Com licença",                     cat:"Essentials",   diff:1 },
  { en:"Sorry",                      pt:"Desculpa",                        cat:"Essentials",   diff:1, register:"informal" },
  { en:"Sorry",                      pt:"Desculpe",                        cat:"Essentials",   diff:1, register:"formal" },
  { en:"Yes",                        pt:"Sim",                             cat:"Essentials",   diff:1 },
  { en:"No",                         pt:"Não",                             cat:"Essentials",   diff:1 },

  // Introductions — formal / informal split
  { en:"My name is…",                pt:"Chamo-me… / O meu nome é…",      cat:"Introductions",diff:1 },
  { en:"What is your name?",         pt:"Como te chamas?",                 cat:"Introductions",diff:1, register:"informal" },
  { en:"What is your name?",         pt:"Como se chama?",                  cat:"Introductions",diff:1, register:"formal" },
  { en:"How are you?",               pt:"Como estás?",                     cat:"Introductions",diff:1, register:"informal" },
  { en:"How are you?",               pt:"Como está?",                      cat:"Introductions",diff:1, register:"formal" },
  { en:"I am fine, thanks",          pt:"Estou bem, obrigado/a",           cat:"Introductions",diff:1 },
  { en:"Where are you from?",        pt:"De onde és?",                     cat:"Introductions",diff:1, register:"informal" },
  { en:"Where are you from?",        pt:"De onde é?",                      cat:"Introductions",diff:1, register:"formal" },
  { en:"I am from England",          pt:"Sou de Inglaterra",               cat:"Introductions",diff:1 },
  { en:"Nice to meet you",           pt:"Muito prazer / Prazer em conhecer-te", cat:"Introductions",diff:1 },

  // Communication — formal / informal split
  { en:"I don't understand",         pt:"Não percebo / Não entendo",       cat:"Communication",diff:2 },
  { en:"Could you speak more slowly?",pt:"Podes falar mais devagar?",      cat:"Communication",diff:2, register:"informal" },
  { en:"Could you speak more slowly?",pt:"Pode falar mais devagar?",       cat:"Communication",diff:2, register:"formal" },
  { en:"Can you repeat that?",       pt:"Podes repetir?",                  cat:"Communication",diff:2, register:"informal" },
  { en:"Can you repeat that?",       pt:"Pode repetir?",                   cat:"Communication",diff:2, register:"formal" },
  { en:"Do you speak English?",      pt:"Falas inglês?",                   cat:"Communication",diff:2, register:"informal" },
  { en:"Do you speak English?",      pt:"Fala inglês?",                    cat:"Communication",diff:2, register:"formal" },
  { en:"I don't speak Portuguese well", pt:"Não falo bem português",       cat:"Communication",diff:2 },
  { en:"What does this mean?",       pt:"O que significa isto?",           cat:"Communication",diff:2 },

  // Numbers

// ── AUDIO ──
const hasSpeech = 'speechSynthesis' in window;
let audioEnabled = localStorage.getItem('ptAudio') === 'true';
let speakTimer = null;

function updateAudioBtn() {
  var btn = document.getElementById('audioBtn');
  if (!btn) return;
  if (audioEnabled) {
    btn.innerHTML = '&#128266; Audio';
    btn.classList.add('on');
  } else {
    btn.innerHTML = '&#128263; Audio';
    btn.classList.remove('on');
    setAudioIndicator(false);
  }
}

function toggleAudio() {
  if (!hasSpeech) { alert('Sorry, your browser does not support text-to-speech.'); return; }
  audioEnabled = !audioEnabled;
  localStorage.setItem('ptAudio', audioEnabled);
  updateAudioBtn();
  if (audioEnabled) speakSide(false);
  else window.speechSynthesis.cancel();
}

function cleanForSpeech(text) {
  return text
    .split(' / ')[0]
    .split(' — ')[0]
    .replace(/\+.*$/g, '')
    .replace(/\([^)]*\)/g, '')
    .replace(/…/g, '')
    .trim();
}

function setAudioIndicator(show) {
  var el = document.getElementById('audioIndicator');
  if (el) el.classList.toggle('hidden', !show);
}

function speakSide(isBack) {
  if (!audioEnabled || !hasSpeech || !deck.length) return;
  var card = deck[cursor];
  var showEn = card._showEn;
  var text, lang;
  if (isBack) {
    text = showEn ? card.pt : card.en;
    lang = showEn ? 'pt-PT' : 'en-GB';
  } else {
    text = showEn ? card.en : card.pt;
    lang = showEn ? 'en-GB' : 'pt-PT';
  }
  window.speechSynthesis.cancel();
  clearTimeout(speakTimer);
  // Small delay so the card has finished rendering before speaking
  speakTimer = setTimeout(function() {
    var utt = new SpeechSynthesisUtterance(cleanForSpeech(text));
    utt.lang = lang;
    utt.rate = 0.88;
    utt.onstart = function() { setAudioIndicator(true); };
    utt.onend   = function() { setAudioIndicator(false); };
    utt.onerror = function() { setAudioIndicator(false); };
    window.speechSynthesis.speak(utt);
  }, 120);
}

// ── SAVE ──
function loadSaved() {
  try { return new Set(JSON.parse(localStorage.getItem('ptSaved') || '[]')); }
  catch { return new Set(); }
}
function persistSaved() { localStorage.setItem('ptSaved', JSON.stringify([...savedSet])); }

let savedSet = loadSaved();
function cardKey(c) { return c.en + '||' + (c.register || ''); }

function toggleSave(e) {
  e.stopPropagation();
  const key = cardKey(deck[cursor]);
  savedSet.has(key) ? savedSet.delete(key) : savedSet.add(key);
  persistSaved();
  updateSaveBtn(deck[cursor]);
  renderSavedList();
}

function updateSaveBtn(card) {
  const saved = savedSet.has(cardKey(card));
  const btn = document.getElementById('saveBtn');
  btn.innerHTML = saved ? '&#9733;' : '&#9734;';
  btn.classList.toggle('saved', saved);
  document.getElementById('savedCount').textContent = savedSet.size;
}

let savedPanelOpen = false;

function toggleSavedPanel() {
  savedPanelOpen = !savedPanelOpen;
  document.getElementById('savedPanel').classList.toggle('open', savedPanelOpen);
  document.getElementById('savedToggleBtn').classList.toggle('active-filter', savedPanelOpen);
  if (savedPanelOpen) renderSavedList();
}

function renderSavedList() {
  document.getElementById('savedCount').textContent = savedSet.size;
  const list = document.getElementById('savedList');
  const saved = cards.filter(c => savedSet.has(cardKey(c)));
  if (!saved.length) {
    list.innerHTML = '<li class="saved-empty">No saved cards yet — click &#9734; on a card to save it.</li>';
    return;
  }
  list.innerHTML = saved.map(c => {
    const k = cardKey(c).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    const regTag = c.register
      ? '<span class="saved-reg ' + c.register + '">' + (c.register === 'informal' ? 'tu' : 'você') + '</span>'
      : '';
    return '<li onclick="jumpToCard(\'' + k + '\')">' +
      '<span class="saved-en">' + c.en + '</span>' + regTag +
      '<span class="saved-pt">' + c.pt + '</span>' +
      '<button class="remove-saved" onclick="removeSaved(event,\'' + k + '\')">&#215;</button></li>';
  }).join('');
}

function jumpToCard(key) {
  const idx = deck.findIndex(c => cardKey(c) === key);
  if (idx !== -1) { cursor = idx; renderCard(); }
}

function removeSaved(e, key) {
  e.stopPropagation();
  savedSet.delete(key);
  persistSaved();
  updateSaveBtn(deck[cursor]);
  renderSavedList();
}

function clearAllSaved() {
  if (!confirm('Clear all saved cards?')) return;
  savedSet.clear();
  persistSaved();
  updateSaveBtn(deck[cursor]);
  renderSavedList();
}

// ── FLASHCARD LOGIC ──
let deck = [], cursor = 0;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildDeck() {
  deck = shuffle(cards).map(c => ({
    ...c,
    _showEn: dirMode === 'en' ? true : dirMode === 'pt' ? false : Math.random() < 0.5
  }));
}

function renderCard() {
  const inner = document.getElementById('cardInner');
  // Instantly reset to front without playing the flip animation
  inner.style.transition = 'none';
  inner.classList.remove('flipped');
  void inner.offsetWidth; // force reflow so the removal applies immediately
  inner.style.transition = '';

  const card = deck[cursor];
  const showEn = card._showEn;

  document.getElementById('frontLabel').textContent = showEn ? 'English' : 'Portuguese';
  document.getElementById('frontWord').textContent  = showEn ? card.en : card.pt;
  document.getElementById('frontCat').textContent   = card.cat;
  document.getElementById('backLabel').textContent  = showEn ? 'Portuguese' : 'English';
  document.getElementById('backWord').textContent   = showEn ? card.pt : card.en;
  document.getElementById('backHint').textContent   = card.cat;
  document.getElementById('diffDot').style.background = diffColors[card.diff] || '#22c55e';
  document.getElementById('cardCounter').textContent = 'Card ' + (cursor + 1) + ' of ' + deck.length;

  const badge = document.getElementById('registerBadge');
  if (card.register === 'informal') {
    badge.textContent = 'Informal · tu';
    badge.className = 'register-badge informal show';
  } else if (card.register === 'formal') {
    badge.textContent = 'Formal · você';
    badge.className = 'register-badge formal show';
  } else {
    badge.className = 'register-badge';
  }

  // idiom note on back face
  var noteEl = document.getElementById('cardNote');
  if (card.note) {
    noteEl.innerHTML = card.note;
    noteEl.classList.add('show');
  } else {
    noteEl.innerHTML = '';
    noteEl.classList.remove('show');
  }

  updateSaveBtn(card);
  speakSide(false);
}

function flipCard() {
  var inner = document.getElementById('cardInner');
  inner.classList.toggle('flipped');
  speakSide(inner.classList.contains('flipped'));
}
function nextCard() { cursor = (cursor + 1) % deck.length; renderCard(); }
function prevCard() { cursor = (cursor - 1 + deck.length) % deck.length; renderCard(); }
function shuffleCards() { buildDeck(); cursor = 0; renderCard(); }

function switchVerbType(btn, cardId, type) {
  btn.closest('.tense-card').querySelectorAll('.verb-type-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  ['ar','er','ir'].forEach(t => {
    var el = document.getElementById(cardId + '-' + t);
    if (el) el.style.display = t === type ? 'block' : 'none';
  });
}

function buildTenses() {
  document.getElementById('tenseGrid').innerHTML = tenses.map(function(t, i) {
    var cardId = 'tc' + i;
    var tabsHtml = ['ar','er','ir'].map(function(type, j) {
      var v = t.verbs[type];
      return '<button class="verb-type-tab' + (j === 0 ? ' active' : '') + '" onclick="switchVerbType(this,\'' + cardId + '\',\'' + type + '\')">-' + type + ' · ' + v.verb + '</button>';
    }).join('');
    var panelsHtml = ['ar','er','ir'].map(function(type, j) {
      var v = t.verbs[type];
      return '<div class="tense-body" id="' + cardId + '-' + type + '"' + (j > 0 ? ' style="display:none"' : '') + '>' +
        '<div style="font-size:0.72rem;color:var(--muted);margin-bottom:8px;font-style:italic">' + v.verb + ' — ' + v.meaning + '</div>' +
        '<table class="conj-table">' +
        v.rows.map(function(r){ return '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>'; }).join('') +
        '</table><div class="tense-example">' + v.example + '</div></div>';
    }).join('');
    return '<div class="tense-card"><h3>' + t.name + ' <em>' + t.subtitle + '</em></h3>' +
      '<div class="verb-type-tabs">' + tabsHtml + '</div>' + panelsHtml + '</div>';
  }).join('');
}

function buildIrregular() {
  document.getElementById('verbTabs').innerHTML = irregularVerbs.map(v =>
    '<button class="verb-tab" onclick="selectVerb(\'' + v.inf + '\')">' + v.inf + '</button>'
  ).join('');

  document.getElementById('verbBlocks').innerHTML = irregularVerbs.map(v => {
    const cols = Object.entries(v.tenses).map(([tname, rows]) =>
      '<div class="verb-tense-col"><h4>' + tname + '</h4><div class="forms">' +
      rows.filter(r => r[1]).map(r => '<div><em>' + r[0] + '</em><span>' + r[1] + '</span></div>').join('') +
      '</div></div>'
    ).join('');
    return '<div class="verb-block" id="vb-' + v.inf + '">' +
      '<div class="verb-header"><h2>' + v.inf + '</h2><span>' + v.meaning + '</span></div>' +
      '<div class="verb-tenses-grid">' + cols + '</div></div>';
  }).join('');

  selectVerb(irregularVerbs[0].inf);
}

function selectVerb(inf) {
  document.querySelectorAll('.verb-tab').forEach(b => b.classList.toggle('active', b.textContent === inf));
  document.querySelectorAll('.verb-block').forEach(b => b.classList.toggle('visible', b.id === 'vb-' + inf));
}

function filterVerbs(q) {
  const val = q.trim().toLowerCase();
  document.querySelectorAll('.verb-tab').forEach(btn => {
    btn.style.display = (!val || btn.textContent.includes(val)) ? '' : 'none';
  });
  if (val) { const m = irregularVerbs.find(v => v.inf.startsWith(val)); if (m) selectVerb(m.inf); }
}

function showSection(id, btn) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
}
