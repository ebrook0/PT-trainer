<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PT Trainer — European Portuguese</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #23273a;
    --border: #2e3347;
    --accent: #4f8ef7;
    --accent2: #7c5cfc;
    --text: #e8eaf0;
    --muted: #7a7f9a;
    --green: #3ecf8e;
    --red: #f66;
    --yellow: #f7c948;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 32px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  header h1 {
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  header span {
    font-size: 0.8rem;
    color: var(--muted);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 8px;
  }

  nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    display: flex;
    gap: 4px;
  }

  nav button {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.875rem;
    padding: 12px 16px;
    transition: color 0.15s, border-color 0.15s;
  }

  nav button:hover { color: var(--text); }
  nav button.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  main {
    flex: 1;
    padding: 40px 32px;
    max-width: 900px;
    margin: 0 auto;
    width: 100%;
  }

  .section { display: none; }
  .section.active { display: block; }

  /* ── FLASHCARDS ── */
  .card-controls {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 32px;
    flex-wrap: wrap;
  }

  .toggle-lang {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    cursor: pointer;
    font-size: 0.8rem;
    padding: 8px 16px;
    transition: border-color 0.15s;
  }
  .toggle-lang:hover { border-color: var(--accent); }

  .lang-indicator { font-size: 0.8rem; color: var(--muted); }
  .card-counter { margin-left: auto; font-size: 0.8rem; color: var(--muted); }

  .card-scene {
    perspective: 1200px;
    width: 100%;
    height: 260px;
    cursor: pointer;
    margin-bottom: 28px;
  }

  .card-inner {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.55s cubic-bezier(0.4,0,0.2,1);
  }

  .card-inner.flipped { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 32px;
    border: 1px solid var(--border);
  }

  .card-front { background: var(--surface); }

  .card-back {
    background: linear-gradient(135deg, var(--surface) 0%, #1e2236 100%);
    transform: rotateY(180deg);
    border-color: var(--accent2);
  }

  .card-label {
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .card-word {
    font-size: 2rem;
    font-weight: 600;
    text-align: center;
    letter-spacing: -0.01em;
  }

  .card-back .card-word { color: var(--accent); }

  .card-hint { font-size: 0.8rem; color: var(--muted); text-align: center; }

  .card-category {
    font-size: 0.72rem;
    padding: 3px 10px;
    border-radius: 20px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    position: absolute;
    top: 16px;
    right: 16px;
  }

  .difficulty-dot {
    position: absolute;
    top: 16px;
    left: 16px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  .save-btn {
    position: absolute;
    bottom: 14px;
    right: 16px;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1.2rem;
    line-height: 1;
    color: var(--muted);
    transition: color 0.15s, transform 0.15s;
    padding: 4px;
    z-index: 10;
  }
  .save-btn:hover { color: var(--yellow); transform: scale(1.2); }
  .save-btn.saved { color: var(--yellow); }

  .card-nav {
    display: flex;
    gap: 12px;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
  }

  .btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    cursor: pointer;
    font-size: 0.875rem;
    padding: 10px 24px;
    transition: background 0.15s, border-color 0.15s;
  }
  .btn:hover { background: var(--border); }

  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .btn-primary:hover { filter: brightness(1.1); }

  .btn-icon { padding: 10px 16px; font-size: 1.1rem; }

  .btn-saved { border-color: var(--yellow); color: var(--yellow); }
  .btn-saved.active-filter { background: var(--yellow); color: #111; }

  /* saved panel */
  .saved-panel {
    margin-top: 28px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    display: none;
  }
  .saved-panel.open { display: block; }

  .saved-panel-header {
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.85rem;
    font-weight: 600;
  }

  .saved-panel-header button {
    background: none;
    border: none;
    color: var(--red);
    cursor: pointer;
    font-size: 0.75rem;
  }

  .saved-list {
    list-style: none;
    max-height: 280px;
    overflow-y: auto;
  }

  .saved-list li {
    display: flex;
    align-items: center;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 0.85rem;
    gap: 12px;
    cursor: pointer;
    transition: background 0.1s;
  }
  .saved-list li:hover { background: var(--surface2); }
  .saved-list li:last-child { border-bottom: none; }

  .saved-en { color: var(--muted); flex: 1; }
  .saved-pt { color: var(--accent); flex: 1; }

  .remove-saved {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 1rem;
    flex-shrink: 0;
    transition: color 0.15s;
  }
  .remove-saved:hover { color: var(--red); }

  .saved-empty {
    padding: 24px;
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
  }

  /* ── VERB TENSES ── */
  .tense-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 20px;
  }

  .tense-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .tense-card h3 {
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    font-size: 0.875rem;
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .tense-card h3 em {
    font-style: normal;
    font-size: 0.72rem;
    color: var(--muted);
    font-weight: 400;
  }

  .tense-body { padding: 16px; }

  .conj-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  .conj-table td { padding: 5px 8px; }
  .conj-table td:first-child { color: var(--muted); font-size: 0.78rem; width: 80px; }
  .conj-table td:last-child { color: var(--accent); font-weight: 500; }

  .tense-example {
    margin-top: 12px;
    font-size: 0.78rem;
    color: var(--muted);
    border-top: 1px solid var(--border);
    padding-top: 10px;
    font-style: italic;
  }

  .tense-example strong { color: var(--text); font-style: normal; font-weight: 400; }

  /* ── IRREGULAR VERBS ── */
  .irr-search { margin-bottom: 24px; }

  .irr-search input {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 0.9rem;
    padding: 10px 16px;
    width: 100%;
    outline: none;
    transition: border-color 0.15s;
  }

  .irr-search input:focus { border-color: var(--accent); }
  .irr-search input::placeholder { color: var(--muted); }

  .verb-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }

  .verb-tab {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.8rem;
    padding: 6px 14px;
    transition: all 0.15s;
  }

  .verb-tab:hover, .verb-tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .verb-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    display: none;
  }

  .verb-block.visible { display: block; }

  .verb-header {
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: baseline;
    gap: 12px;
  }

  .verb-header h2 { font-size: 1.3rem; }
  .verb-header span { color: var(--muted); font-size: 0.85rem; }

  .verb-tenses-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 0;
  }

  .verb-tense-col {
    padding: 16px 20px;
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }

  .verb-tense-col h4 {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .verb-tense-col .forms { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; }
  .verb-tense-col .forms span { color: var(--accent); }
  .verb-tense-col .forms em { font-style: normal; color: var(--muted); font-size: 0.75rem; margin-right: 6px; }

  @media (max-width: 600px) {
    main { padding: 24px 16px; }
    nav { padding: 0 16px; }
    header { padding: 14px 16px; }
    .card-word { font-size: 1.5rem; }
    .tense-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <h1>PT Trainer</h1>
  <span>European Portuguese</span>
</header>

<nav>
  <button class="active" onclick="showSection('flashcards', this)">Flashcards</button>
  <button onclick="showSection('tenses', this)">Verb Tenses</button>
  <button onclick="showSection('irregular', this)">Irregular Verbs</button>
</nav>

<main>

  <!-- FLASHCARDS -->
  <section id="flashcards" class="section active">
    <div class="card-controls">
      <button class="toggle-lang" onclick="toggleLang()">&#8644; Flip Language</button>
      <span class="lang-indicator" id="langIndicator">Prompt: English &#8594; Portuguese</span>
      <span class="card-counter" id="cardCounter">Card 1</span>
    </div>

    <div class="card-scene" onclick="flipCard()">
      <div class="card-inner" id="cardInner">
        <div class="card-face card-front">
          <div class="difficulty-dot" id="diffDot"></div>
          <div class="card-label" id="frontLabel">English</div>
          <div class="card-word" id="frontWord"></div>
          <div class="card-hint">Click to reveal</div>
          <div class="card-category" id="frontCat"></div>
          <button class="save-btn" id="saveBtn" onclick="toggleSave(event)" title="Save card">&#9734;</button>
        </div>
        <div class="card-face card-back">
          <div class="card-label" id="backLabel">Portuguese</div>
          <div class="card-word" id="backWord"></div>
          <div class="card-hint" id="backHint"></div>
        </div>
      </div>
    </div>

    <div class="card-nav">
      <button class="btn btn-icon" onclick="prevCard()">&#8592;</button>
      <button class="btn btn-primary" onclick="nextCard()">Next card</button>
      <button class="btn btn-icon" onclick="shuffleCards()">&#8652;</button>
      <button class="btn btn-saved" id="savedToggleBtn" onclick="toggleSavedPanel()">&#9733; Saved (<span id="savedCount">0</span>)</button>
    </div>

    <div class="saved-panel" id="savedPanel">
      <div class="saved-panel-header">
        <span>Saved cards</span>
        <button onclick="clearAllSaved()">Clear all</button>
      </div>
      <ul class="saved-list" id="savedList"></ul>
    </div>
  </section>

  <!-- VERB TENSES -->
  <section id="tenses" class="section">
    <div class="tense-grid" id="tenseGrid"></div>
  </section>

  <!-- IRREGULAR VERBS -->
  <section id="irregular" class="section">
    <div class="irr-search">
      <input type="text" placeholder="Search verb&#8230;" oninput="filterVerbs(this.value)" id="verbSearch">
    </div>
    <div class="verb-tabs" id="verbTabs"></div>
    <div id="verbBlocks"></div>
  </section>

</main>

// ── SAVE ──
function loadSaved() {
  try { return new Set(JSON.parse(localStorage.getItem('ptSaved') || '[]')); }
  catch { return new Set(); }
}
function persistSaved() { localStorage.setItem('ptSaved', JSON.stringify([...savedSet])); }

let savedSet = loadSaved();
function cardKey(c) { return c.en; }

function toggleSave(e) {
  e.stopPropagation();
  const key = cardKey(deck[cursor]);
  savedSet.has(key) ? savedSet.delete(key) : savedSet.add(key);
  persistSaved();
  updateSaveBtn(deck[cursor]);
  renderSavedList();
}

function updateSaveBtn(card) {
  const saved = savedSet.has(cardKey(card));
  const btn = document.getElementById('saveBtn');
  btn.innerHTML = saved ? '&#9733;' : '&#9734;';
  btn.classList.toggle('saved', saved);
  document.getElementById('savedCount').textContent = savedSet.size;
}

let savedPanelOpen = false;

function toggleSavedPanel() {
  savedPanelOpen = !savedPanelOpen;
  document.getElementById('savedPanel').classList.toggle('open', savedPanelOpen);
  document.getElementById('savedToggleBtn').classList.toggle('active-filter', savedPanelOpen);
  if (savedPanelOpen) renderSavedList();
}

function renderSavedList() {
  document.getElementById('savedCount').textContent = savedSet.size;
  const list = document.getElementById('savedList');
  const saved = cards.filter(c => savedSet.has(cardKey(c)));
  if (!saved.length) {
    list.innerHTML = '<li class="saved-empty">No saved cards yet &#8212; click &#9734; on a card to save it.</li>';
    return;
  }
  list.innerHTML = saved.map(c => {
    const k = cardKey(c).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    return '<li onclick="jumpToCard(\'' + k + '\')">' +
      '<span class="saved-en">' + c.en + '</span>' +
      '<span class="saved-pt">' + c.pt + '</span>' +
      '<button class="remove-saved" onclick="removeSaved(event,\'' + k + '\')">&#215;</button>' +
      '</li>';
  }).join('');
}

function jumpToCard(key) {
  const idx = deck.findIndex(c => cardKey(c) === key);
  if (idx !== -1) { cursor = idx; renderCard(); }
}

function removeSaved(e, key) {
  e.stopPropagation();
  savedSet.delete(key);
  persistSaved();
  updateSaveBtn(deck[cursor]);
  renderSavedList();
}

function clearAllSaved() {
  if (!confirm('Clear all saved cards?')) return;
  savedSet.clear();
  persistSaved();
  updateSaveBtn(deck[cursor]);
  renderSavedList();
}

// ── FLASHCARD LOGIC ──
let deck = [], cursor = 0, showEnglishFirst = true;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildDeck() { deck = shuffle(cards); }

function renderCard() {
  const card = deck[cursor];
  document.getElementById('cardInner').classList.remove('flipped');
  document.getElementById('frontLabel').textContent = showEnglishFirst ? 'English' : 'Portuguese';
  document.getElementById('frontWord').textContent = showEnglishFirst ? card.en : card.pt;
  document.getElementById('frontCat').textContent = card.cat;
  document.getElementById('backLabel').textContent = showEnglishFirst ? 'Portuguese' : 'English';
  document.getElementById('backWord').textContent = showEnglishFirst ? card.pt : card.en;
  document.getElementById('backHint').textContent = card.cat;
  document.getElementById('diffDot').style.background = diffColors[card.diff] || '#7a7f9a';
  document.getElementById('cardCounter').textContent = 'Card ' + (cursor + 1) + ' of ' + deck.length;
  updateSaveBtn(card);
}

function flipCard() { document.getElementById('cardInner').classList.toggle('flipped'); }
function nextCard() { cursor = (cursor + 1) % deck.length; renderCard(); }
function prevCard() { cursor = (cursor - 1 + deck.length) % deck.length; renderCard(); }
function shuffleCards() { buildDeck(); cursor = 0; renderCard(); }

function toggleLang() {
  showEnglishFirst = !showEnglishFirst;
  document.getElementById('langIndicator').textContent = showEnglishFirst
    ? 'Prompt: English → Portuguese'
    : 'Prompt: Portuguese → English';
  renderCard();
}

    return '<div class="verb-block" id="vb-' + v.inf + '">' +
      '<div class="verb-header"><h2>' + v.inf + '</h2><span>' + v.meaning + '</span></div>' +
      '<div class="verb-tenses-grid">' + cols + '</div></div>';
  }).join('');

  selectVerb(irregularVerbs[0].inf);
}

function selectVerb(inf) {
  document.querySelectorAll('.verb-tab').forEach(b => b.classList.toggle('active', b.textContent === inf));
  document.querySelectorAll('.verb-block').forEach(b => b.classList.toggle('visible', b.id === 'vb-' + inf));
}

function filterVerbs(q) {
  const val = q.trim().toLowerCase();
  document.querySelectorAll('.verb-tab').forEach(btn => {
    btn.style.display = (!val || btn.textContent.includes(val)) ? '' : 'none';
  });
  if (val) { const m = irregularVerbs.find(v => v.inf.startsWith(val)); if (m) selectVerb(m.inf); }
}

function showSection(id, btn) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
}

buildDeck(); renderCard(); buildTenses(); buildIrregular(); renderSavedList();
</script>
</body>
</html>
